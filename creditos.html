<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créditos fotográficos · Restaurante El Gallego</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .credits-main{max-width:760px;margin:0 auto;padding:4em 5% 6em;}
  .credits-main h1{margin-bottom:.3em;}
  .credits-main > p{color:#6b5f56;margin-bottom:2em;}
  .credits-list{display:grid;gap:1em;}
  .credits-list li{background:var(--white);border-radius:12px;padding:1em 1.3em;box-shadow:var(--shadow);font-size:.9rem;}
  .credits-back{display:inline-block;margin:2em 5% 0;font-weight:700;color:var(--wine);}
</style>

<body>
<a class="credits-back" href="index.html">← Volver a la web</a>
<main class="credits-main">
  <h1>Créditos fotográficos</h1>
  <p>Fotografías de cortesía usadas mientras se incorporan las fotos reales del restaurante, bajo licencias Creative Commons vía <a href="https://openverse.org" target="_blank" rel="noopener">Openverse</a> y <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a>.</p>
  <ul class="credits-list" data-credits></ul>
</main>
<script defer src="lib/credits-render.js"></script>

</html>
